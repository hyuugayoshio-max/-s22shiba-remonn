<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9eadd7">
<meta name="format-detection" content="telephone=no">
<title>トーク レモン女</title>
<style>
  :root{
    --bg:#9eadd7;
    --text:#1c2131;
    --other:#ffffff;
    --self:#cceb95;
    --time:#49536c;
    --read:#50886a;
    --date:#7b8ab3;
    --icon-bottom:#23262f;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:linear-gradient(to bottom, var(--bg) 0, var(--bg) 60%, #fff 60%, #fff 100%);
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  .app{
    position:fixed;
    top:0;bottom:0;left:0;right:0;
    width:100%;
    max-width:430px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(ellipse 60% 22% at 0% 40%, rgba(255,255,255,.30), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 55% 20% at 0% 79%, rgba(255,255,255,.26), rgba(255,255,255,0) 70%),
      var(--bg);
  }
  /* ホーム画面から開いたときの高さ不足を補正 */
  html.standalone .app{
    bottom:auto;
    height:100lvh;
  }

  /* ===== ヘッダー ===== */
  .top{
    flex:none;
    padding-top:calc(var(--sat) + 12px);
  }
  .header{
    height:52px;
    display:flex;
    align-items:center;
    padding:0 13px 0 8px;
  }
  .back{
    flex:none;
    width:28px;height:28px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;
  }
  .back svg{width:14px;height:14px;display:block;}
  .name{
    flex:1;
    min-width:0;
    margin-left:12px;
    font-size:18px;
    font-weight:700;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:.02em;
  }
  .head-icons{
    flex:none;
    display:flex;
    align-items:center;
    gap:18px;
    margin-left:12px;
  }
  .head-icons svg{width:22px;height:22px;display:block;}

  /* ===== トーク欄 ===== */
  .talk{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
    padding:4px 13px 18px 7px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .talk::-webkit-scrollbar{display:none;}

  .date{
    display:flex;
    justify-content:center;
    margin-top:18px;
  }
  .date span{
    display:inline-block;
    height:25px;
    line-height:25px;
    padding:0 12px;
    border-radius:12.5px;
    background:var(--date);
    color:#fff;
    font-size:12px;
    font-weight:500;
    letter-spacing:.02em;
  }

  .row{
    display:flex;
    margin-top:16px;
  }
  .row.other{justify-content:flex-start;align-items:flex-start;}
  .row.self{justify-content:flex-end;}

  .avatar{
    flex:none;
    width:36px;height:36px;
    border-radius:50%;
    margin-right:13px;
    object-fit:cover;
    display:block;
    background:#d9dbe3;
  }

  .group{
    display:flex;
    align-items:flex-end;
    min-width:0;
  }
  .row.other .group{max-width:calc(100% - 49px);}
  .row.self .group{max-width:calc(100% - 40px);}

  .bubble{
    position:relative;
    flex:0 1 auto;
    min-width:0;
    padding:10px 14px 11px;
    font-size:15.5px;
    line-height:1.46;
    letter-spacing:.02em;
    overflow-wrap:anywhere;
    box-shadow:0 .5px 1px rgba(28,33,49,.04);
  }
  .row.other .bubble{
    background:var(--other);
    border-radius:18px 22px 22px 22px;
  }
  .row.self .bubble{
    background:var(--self);
    border-radius:22px 18px 22px 22px;
  }
  .tail{
    position:absolute;
    top:0;
    width:16px;height:18px;
    display:block;
    pointer-events:none;
  }
  .row.other .tail{left:-5px;}
  .row.self .tail{right:-5px;transform:scaleX(-1);}
  .txt{position:relative;z-index:1;display:block;}

  /* 19:36 必ず2行 */
  .bubble.fix2{
    letter-spacing:0;
    font-size:min(15.5px, 3.95vw);
  }
  .bubble.fix2 .line{display:block;white-space:nowrap;}

  .time{
    flex:none;
    font-size:12px;
    color:var(--time);
    line-height:1.2;
    white-space:nowrap;
  }
  .row.other .time{margin-left:6px;margin-bottom:0;}
  .meta{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-right:7px;
    margin-bottom:0;
    gap:3px;
  }
  .meta svg{width:21px;height:9px;display:block;overflow:visible;}

  .heart{color:#e3162b;font-weight:700;}

  /* ===== 下部入力欄 ===== */
  .bottom{
    flex:none;
    background:#fff;
    padding:9px 12px calc(16px + var(--sab)) 14px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .bottom > svg{flex:none;width:23px;height:23px;display:block;}
  .input{
    flex:1;
    min-width:0;
    height:38px;
    border-radius:12px;
    background:#f3f4f6;
    border:1px solid #e6e8ec;
    display:flex;
    align-items:center;
    padding:0 10px 0 16px;
  }
  .input .ph{
    flex:1;
    min-width:0;
    font-size:15px;
    color:#a9adb5;
    white-space:nowrap;
    overflow:hidden;
  }
  .input svg{flex:none;width:22px;height:22px;display:block;}
</style>
</head>

<div class="app" id="app">

    <div class="header">
      <div class="back" aria-label="戻る">

  <div class="talk" id="talk"></div>

  var TAIL = '<svg class="tail" viewBox="0 0 16 18" aria-hidden="true"><path fill="FILL" d="M1.7 2.9Q6.4 4 10.8 4.3L13 6V16H5.5V14.2C5 9.6 3.6 6 1.4 4.1Q.5 3.3 1.7 2.9Z"/></svg>';
  var CHECK = '<svg viewBox="0 0 21 9" fill="none" stroke="#50886a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="miter"><path d="M1.3 4.4 4.6 7.6 11 1.3"/><path d="M8.3 4.9 11 7.6 19.8 .9"/></svg>';

  var html = '';
  talks.forEach(function(m){
    if (m.d) {
      html += '<div class="date"><span>' + esc(m.d) + '</span></div>';
      return;
    }
    var lines = m.s.split('／').map(deco);
    var body = m.fix2
      ? lines.map(function(l){return '<span class="line">' + l + '</span>';}).join('')
      : lines.join('<br>');
    var cls = 'bubble' + (m.fix2 ? ' fix2' : '');

    if (m.w === 'o') {
      html += '<div class="row other">'
        + '<img class="avatar" alt="" src="' + AVATAR + '">'
        + '<div class="group">'
        +   '<div class="' + cls + '">' + TAIL.replace('FILL','#ffffff') + '<span class="txt">' + body + '</span></div>'
        +   '<div class="time">' + m.t + '</div>'
        + '</div></div>';
    } else {
      html += '<div class="row self">'
        + '<div class="group">'
        +   '<div class="meta">' + CHECK + '<div class="time">' + m.t + '</div></div>'
        +   '<div class="' + cls + '">' + TAIL.replace('FILL','#cceb95') + '<span class="txt">' + body + '</span></div>'
        + '</div></div>';
    }
  });

  var talk = document.getElementById('talk');
  talk.innerHTML = html;

  function toBottom(){ talk.scrollTop = talk.scrollHeight; }
  function refresh(){ fitHeight(); toBottom(); }
  refresh();
  window.addEventListener('load', refresh);
  window.addEventListener('resize', refresh);
  window.addEventListener('orientationchange', function(){ setTimeout(refresh, 300); });
  setTimeout(refresh, 300);

  // ページ全体のスクロール・ピンチ拡大・ダブルタップ拡大・選択を止める
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) { e.preventDefault(); return; }
    if (!talk.contains(e.target)) e.preventDefault();
  }, {passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, {passive:false});
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });
  document.addEventListener('selectstart', function(e){ e.preventDefault(); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
